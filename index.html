<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Calcule o salário mensal com horas trabalhadas">
    <meta name="keywords" content="salario, hora, cálculo">
    <meta name="description" content="Calcula o valor do salário total com base no pagamento por hora">
    <meta name="author" content="Gabriel Vitório dos Santos">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/button.js" defer></script>
</head>
<body>
    <main class="container">
        <article id="firstExercise">
            <form id="firstExercise__form" class="article__form">
                <style>@import url('./css/firstExercise/firstExercise.css');</style>
                <h3 class="form__h3--numeracao-do-exercicio">Exercício 01</h3>
                <h2>Calculadora simples</h2>
                <p>Digite os valores nos campos às extremidades e o simbolo da operação no meio</p>
                <div id="form__div--valor01" class="form__div--calculadora">
                    <label>Digite o primeiro valor da operação</label>
                    <input id="div__input--valor01"/>
                </div>

                <div id="form__div--sinal-de-operacao" class="form__div--calculadora">
                    <label>Digite o sinal da operação</label>
                    <input id="div__input--sinal-de-operacao"/>
                </div>

                <div id="form__div--valor02" class="form__div--calculadora">
                    <label>Digite o segundo valor da operação</label>
                    <input id="div__input--valor02"/>
                </div>

                <div id="form__div--calculadora-resultado" class="form__div--resultado">
                    <p>Digite valores válidos e veja seus resultados aqui constará o resultado</p>
                </div>
            </form>
        </article>
        <button>Previous JS file</button>
        <button>Restart page</button>
        <button>Next JS file</button>
        
    </main>
</body>
</html>
