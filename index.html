<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Exercícios de programação em JS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Calcule o salário mensal com horas trabalhadas">
    <meta name="keywords" content="salario, hora, cálculo">
    <meta name="description" content="Calcula o valor do salário total com base no pagamento por hora">
    <meta name="author" content="Gabriel Vitório dos Santos">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
    <article id="firstExercise" class="desafios">
        <h3 class="form__h3--numeracao-do-exercicio">Exercício 01</h3>
        <form id="firstExercise__form" class="article__form">
            <style>@import url('./css/firstExercise/firstExercise.css');</style>

            <h2>Calculadora simples</h2>
            <p>Digite os valores nos campos às extremidades e o simbolo da operação no meio</p>
            <div class="form__div--calculadora-inputs">
                <div id="form__div--valor01" class="form__div--calculadora form__div--inputs">
                    <label for="PrimeiroValor">Digite o primeiro valor da operação</label>
                    <input id="div__input--valor01" title="PrimeiroValor" placeholder="e.g. 56" required autofocus />
                </div>
                
                <div id="form__div--sinal-de-operacao" class="form__div--calculadora form__div--inputs">
                    <label for="sinalDaOperacao">Digite o sinal da operação</label>
                    <input id="div__input--sinal-de-operacao" title="sinalDaOperacao" placeholder="'+'" required />
                </div>
                
                <div id="form__div--valor02" class="form__div--calculadora form__div--inputs">
                    <label for="SegundoValor">Digite o segundo valor da operação</label>
                    <input id="div__input--valor02" title="SegundoValor" placeholder="e.g. 26" required />
                </div>
            </div>

            <div id="form__div--calculadora-resultado" class="form__div--resultado">
                <p id="div__p--calculo-resultado"></p>
            </div>
        </form>
    </article>

    <article id="secondExercise" class="desafios">
        <h3 class="form__h3--numeracao-do-exercicio">Exercício 02</h3>
        
        <form id="firstExercise__form" class="article__form">
            <h2>Converta Reais para moedas estrangeiras</h2>
            <div id="form__div--reais">
                <label for="Reais"></label>
                <span>R$</span><input type="Number" title="Reais" placeholder="e.g. 32" required autofocus>
            </div>
            <div>
                <p id="div__p--resultado-da-conversao"></p>
            </div>
        </form>
    </article>

    <article id="thirdExercise" class="desafios">
        <h3 class="form__h3--numeracao-do-exercicio">Exercício 03</h3>
        <form id="thirdExercise--form" class="article__form">
            <h2>Escrevendo 20 vezes 'JavaScript' com while loop</h2>
        </form>
    </article>

    <article id="fourthExercise" class="desafios">
        <h3 class="form__h3--numeracao-do-exercicio">Exercício 04</h3>
        <form id="fourthExercise--form" class="article__form">
            
        </form>
    </article>

    <article id="fifthExercise" class="desafios">
        <h3 class="form__h3--numeracao-do-exercicio">Exercício 05</h3>
        <form id="fifthExercise--form" class="article__form">
            
        </form>
    </article>

    <div id="div--navigation-buttons">
        <div id="div__div--exercise-search">
            <input id="div__input--actual-exercise" type="number" title="actual" placeholder="1"/>
        </div>
        <button id="previousButton" class="navigation-buttons"><img src="./img/arrow-left.svg" title="previousButton" /></button>
        <button id="restartButton" class="navigation-buttons"><img src="./img/arrow-restart.svg" title="restartButton" /></button>
        <button id="nextButton" class="navigation-buttons"><img src="./img/arrow-right.svg" title="nextButton" /></button>
    </div>

    </main>
    <script src="js/button.js"></script>
</body>

</html>
